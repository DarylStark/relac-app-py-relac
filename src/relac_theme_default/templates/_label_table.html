{% from "_entity_link.html" import entity_link %}

{% macro label_table(labels, title="Labels") %}
<div class="card table-card">
    <header class="table-card-header">
        <h3 class="table-card-title">{{ title }}</h3>
        <div class="table-card-actions"></div>
    </header>
    <div class="table-scroll">
        <table id="labels-table" class="resources" data-sortable>
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col" class="right fit-content" data-sort-type="number">Contributor count</th>
                </tr>
            </thead>
            <tbody>
                {% for label in labels %}
                    <tr data-href="{{ label.id }}.html">
                        <td>{{ entity_link(label, label.name) }}</td>
                        <td class="right fit-content" data-sort-value="{{ label.contributor_objs | length }}">
                            <pre>{{ label.contributor_objs | length }}</pre>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endmacro %}
