<html class="dark">

<head>
    <title>Relac library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        try {
            if (localStorage.getItem("relac-theme") === "light") {
                document.documentElement.classList.replace("dark", "light");
            }
        } catch {
        }
    </script>
    <link rel='stylesheet' href="static/style.css" />
</head>

<body>

    <main class="page-shell">
        <header class="page-header">
            <div class="page-title-group">
                <h1>Relac library</h1>
                <p class="page-subtitle">All books!</p>
            </div>

            <nav class="tab-nav">
                <a href="index.html" {% if active_page == "overview" %}class="active"{% endif %}>Overview</a>
                <a href="authors.html" {% if active_page == "authors" %}class="active"{% endif %}>Authors</a>
                <a href="owners.html" {% if active_page == "owners" %}class="active"{% endif %}>Owners</a>
                <a href="works.html" {% if active_page == "works" %}class="active"{% endif %}>Works</a>
                <a href="books.html" {% if active_page == "books" %}class="active"{% endif %}>Books</a>
                <a href="collections.html" {% if active_page == "collections" %}class="active"{% endif %}>Collections</a>
                <a href="lists.html" {% if active_page == "lists" %}class="active"{% endif %}>Reading lists</a>
                <button class="library-search-toggle" type="button" aria-label="Search library" title="Search library">
                    <span class="library-search-icon" aria-hidden="true"></span>
                </button>
                <button class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">
                    <span class="theme-toggle-icon" aria-hidden="true">&#x263c;</span>
                </button>
            </nav>
        </header>

        <dialog class="library-search-dialog" aria-labelledby="library-search-title">
            <section class="library-search-panel">
                <header class="library-search-header">
                    <h2 id="library-search-title">Search library</h2>
                    <button class="library-search-close" type="button" aria-label="Close search">&times;</button>
                </header>
                <label class="library-search-field">
                    <span class="visually-hidden">Search titles and metadata</span>
                    <input class="library-search-input" type="search" placeholder="Search titles, authors, ISBN..." autocomplete="off">
                </label>
                <p class="library-search-status" role="status" aria-live="polite"></p>
                <ul class="library-search-results"></ul>
            </section>
        </dialog>
        
        {% block content %}
        {% endblock content %}
    </main>

    <script src="static/sortable-tables.js" defer></script>
    <script src="static/search.js" defer></script>
    <script src="static/theme.js" defer></script>
</body>
</html>
