{% macro list_table(lists, title="Lists") %}
<div class="card table-card">
    <header class="table-card-header">
        <h3 class="table-card-title">{{ title }}</h3>
        <div class="table-card-actions"></div>
    </header>
<div class="table-scroll">
    <table id="lists-table" class="resources" data-sortable>
        <thead>
            <tr>
                <th scope="col">Name</th>
            </tr>
        </thead>
        <tbody>
            {% for list in lists %}
                {{ list_row(list) }}
            {% endfor %}
        </tbody>
    </table>
</div>
</div>
{% endmacro %}

{% macro list_row(list) %}
<tr data-href="{{ list.id }}.html">
    <td>{{ list.name }}</td>
</tr>
{% endmacro %}
