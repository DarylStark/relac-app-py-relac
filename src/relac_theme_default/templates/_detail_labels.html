{% macro detail_labels(labels) %}
{% if labels %}
<section class="detail-labels" aria-label="Labels">
    <ul class="detail-label-list">
        {% for label in labels | sort(attribute="name") %}
            <li><a class="detail-label-pill" href="{{ label.id }}.html">{{ label.name }}</a></li>
        {% endfor %}
    </ul>
</section>
{% endif %}
{% endmacro %}
