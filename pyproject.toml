[project]
name = "relac"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Daryl Stark", email = "daryl@dstark.nl" }]
requires-python = ">=3.15"
dependencies = [
    "isbnlib2>=3.11.24",
    "jinja2>=3.1.6",
    "pycountry>=26.2.16",
    "pydantic>=2.14.1",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
]

[project.scripts]
relac = "relac:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["relac", "relac_theme_default"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
exclude = ["docs/*.py"]
select = [
    "E",   # pycodestyle (errors)
    "W",   # pycodestyle (warnings)
    "PL",  # pylint
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "LOG", # flake8-logging
    "Q",   # flake8-quotes
    "ANN", # flak8-annotations
    "ICN", # flake8-import-conventions
    "SLF", # flake8-self
    "TD",  # flake8-todo
    "FIX", # flake8-fixme
    "D",   # pydocstyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "N",   # pep8-naming
]
ignore = [
    "B008",    # function call in default argument
    "PLR2004", # magic value used in comparison
    "TD003",   # missing link
    "TD002",   # missing author
    "PLR0913", # too many arguments
    "FIX002",  # fixme found - skipped for now
    "PLR0917", # too many positional arguments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = 'single'
multiline-quotes = 'double'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
docstring-code-format = true
exclude = ["docs/*.py"]

[tool.pytest.ini_options]
addopts = [
    '--cov=relac',
    '--cov-report=html',
    '--cov-report=lcov',
    '--cov-branch',
]
testpaths = ['tests']

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "ty>=0.0.90",
]
